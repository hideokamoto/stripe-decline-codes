name: Stripe doc sync check

on:
  schedule:
    # Weekly, Monday 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - 'scripts/check-doc-sync.ts'
      - 'src/data/decline-codes.ts'
      - '.github/workflows/doc-sync.yml'

permissions:
  contents: read

jobs:
  check:
    name: Compare DECLINE_CODES against Stripe docs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check decline code sync
        run: pnpm run docs:sync-check
