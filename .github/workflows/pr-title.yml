name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: read

jobs:
  check:
    name: PR title and commits are Conventional Commits
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # release-please reads commit subjects on main to decide the version
          # bump. With squash merges the PR title becomes that subject; with
          # merge/rebase merges the individual commits land on main. Check both.
          PATTERN='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^()]+\))?!?: .+'
          if ! printf '%s' "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title \"$PR_TITLE\" is not a Conventional Commit."
            echo "::error::Use e.g. \"feat: add foo\", \"fix(api)!: break bar\", \"chore: bump deps\"."
            exit 1
          fi

      - name: Check commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          PATTERN='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^()]+\))?!?: .+'
          FAILED=0
          while IFS= read -r subject; do
            case "$subject" in Merge\ *) continue ;; esac
            if ! printf '%s' "$subject" | grep -qE "$PATTERN"; then
              echo "::error::Non-conventional commit subject: $subject"
              FAILED=1
            fi
          done < <(git log --format=%s "$BASE"..HEAD)
          [ "$FAILED" -eq 0 ]
