name: CI

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'tsconfig.typedoc.json'
      - 'typedoc.json'
      - 'vite.config.ts'
      - 'vitest.workers.config.ts'
      - 'biome.json'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'
      - '.releaserc.json'
      - 'commitlint.config.js'
      - '.husky/**'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'tsconfig.typedoc.json'
      - 'typedoc.json'
      - 'vite.config.ts'
      - 'vitest.workers.config.ts'
      - 'biome.json'
      - 'pnpm-workspace.yaml'
      - 'scripts/**'
      - '.releaserc.json'
      - 'commitlint.config.js'
      - '.husky/**'

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
      # Run all versions in parallel
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint

      - name: Run type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

  test-workers:
    name: Test on Cloudflare Workers (workerd)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests in workerd
        run: pnpm run test:workers
